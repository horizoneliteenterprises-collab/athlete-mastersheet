name: Fix Team Partnerships tab
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='TEAM PARTNERSHIPS'
          if marker not in s:
            s=s.replace('</body>', '<script>document.addEventListener("DOMContentLoaded",function(){var a=[...document.querySelectorAll("body *")].find(x=>x.children.length===0&&(x.textContent||"").trim().toUpperCase()==="CAMPAIGN");if(a){var t=a.parentElement.cloneNode(true);t.textContent="TEAM PARTNERSHIPS";a.parentElement.parentElement.insertBefore(t,a.parentElement.nextSibling);}});</script></body>',1)
            p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add Team Partnerships tab beside Campaign" || exit 0
          git push
