name: Fix Team Partnerships navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace one-shot nav script with persistent observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script>document.addEventListener("DOMContentLoaded",function(){var a=[...document.querySelectorAll("body *")].find(x=>x.children.length===0&&(x.textContent||"").trim().toUpperCase()==="CAMPAIGN");if(a){var t=a.parentElement.cloneNode(true);t.textContent="TEAM PARTNERSHIPS";a.parentElement.parentElement.insertBefore(t,a.parentElement.nextSibling);}});</script>'
          new = '''<script>
          (function () {
            function addTeamPartnershipsTab() {
              if (document.querySelector('[data-team-partnerships-tab="1"]')) return true;
              var campaignLeaf = Array.from(document.querySelectorAll('body *')).find(function (el) {
                return el.children.length === 0 && (el.textContent || '').trim().toUpperCase() === 'CAMPAIGN';
              });
              if (!campaignLeaf) return false;
              var campaign = campaignLeaf.closest('button,[role="tab"],a,div') || campaignLeaf.parentElement;
              if (!campaign || !campaign.parentElement) return false;
              var tab = campaign.cloneNode(true);
              tab.setAttribute('data-team-partnerships-tab', '1');
              tab.removeAttribute('id');
              tab.removeAttribute('aria-current');
              tab.removeAttribute('aria-selected');
              tab.textContent = 'TEAM PARTNERSHIPS';
              campaign.insertAdjacentElement('afterend', tab);
              return true;
            }
            addTeamPartnershipsTab();
            new MutationObserver(addTeamPartnershipsTab).observe(document.documentElement, { childList: true, subtree: true });
            var tries = 0;
            var timer = setInterval(function () {
              if (addTeamPartnershipsTab() || ++tries > 120) clearInterval(timer);
            }, 250);
          })();
          </script>'''
          if old not in s:
              raise SystemExit('Expected old Team Partnerships script was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Team Partnerships tab placement' || true
          git rm .github/workflows/fix-team-partnerships-nav.yml
          git commit -m 'Remove temporary navigation fix workflow'
          git push
