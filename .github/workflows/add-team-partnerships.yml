name: Add Team Partnerships column

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Team Partnerships column
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-team-partnerships-column="1"'
          if marker in s:
              print('Column patch already present')
              raise SystemExit(0)
          script = r'''<script data-team-partnerships-column="1">
          (function () {
            function addColumn() {
              if (document.querySelector('[data-team-partnerships-header]')) return true;
              const all = Array.from(document.querySelectorAll('*'));
              const header = all.find(el => el.children.length === 0 && el.textContent.trim().toLowerCase() === 'campaigns');
              if (!header) return false;
              const row = header.closest('tr,[role="row"]') || header.parentElement;
              if (!row) return false;
              const cells = Array.from(row.children);
              const headerIndex = cells.indexOf(header);
              if (headerIndex < 0) return false;
              const newHeader = header.cloneNode(true);
              newHeader.textContent = 'Team Partnerships';
              newHeader.setAttribute('data-team-partnerships-header', '1');
              header.insertAdjacentElement('afterend', newHeader);
              const rows = row.closest('table') ? Array.from(row.closest('table').querySelectorAll('tr')).filter(r => r !== row) : Array.from(row.parentElement.children).filter(r => r !== row);
              rows.forEach(r => {
                const children = Array.from(r.children);
                if (children.length <= headerIndex) return;
                const cell = children[headerIndex].cloneNode(true);
                cell.textContent = '';
                children[headerIndex].insertAdjacentElement('afterend', cell);
              });
              return true;
            }
            let tries = 0;
            const timer = setInterval(function () {
              tries++;
              if (addColumn() || tries > 120) clearInterval(timer);
            }, 250);
            new MutationObserver(addColumn).observe(document.documentElement, { childList: true, subtree: true });
          })();
          </script>'''
          needle = '</body>'
          if needle not in s:
              raise SystemExit('Could not find closing body tag')
          s = s.replace(needle, script + '\n' + needle, 1)
          p.write_text(s, encoding='utf-8')
          print('Injected Team Partnerships column patch')
          PY

      - name: Commit website change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-team-partnerships.yml
          git commit -m "Add Team Partnerships column"
          git push
